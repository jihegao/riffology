<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#17352f" flood-opacity=".11"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#697a75"/>
    </marker>
    <marker id="diamond" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 6L6 1L11 6L6 11Z" fill="#fff" stroke="#697a75" stroke-width="1.5"/>
    </marker>
    <style>
      .sans{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,Menlo,monospace}
      .serif{font-family:Georgia,"Songti SC",serif}
      .ink{fill:#182b27}.muted{fill:#65736f}.soft{fill:#899590}.white{fill:#fff}
      .t10{font-size:10px}.t11{font-size:11px}.t12{font-size:12px}.t13{font-size:13px}.t14{font-size:14px}.t15{font-size:15px}.t16{font-size:16px}
      .h1{font-size:31px;font-weight:750}.h2{font-size:23px;font-weight:750}.h3{font-size:17px;font-weight:750}
