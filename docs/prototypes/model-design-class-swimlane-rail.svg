  <rect x="76" y="352" width="286" height="104" rx="13" class="card"/>
  <text x="92" y="376" class="sans muted t10" font-weight="700">RIFF AGENT</text>
  <text x="92" y="400" class="sans ink t11">已形成结构化变更建议。</text>
  <text x="92" y="421" class="sans muted t10">类图：新增 PriorityQueue</text>
  <text x="92" y="440" class="sans muted t10">泳道：新增 VIP 分流步骤</text>
  <rect x="76" y="476" width="316" height="76" rx="12" class="amber" stroke="#d4aa60"/>
  <text x="92" y="502" class="sans ink t11" font-weight="750">等待确认</text>
  <text x="92" y="523" class="sans muted t10">右侧附加栏有 3 个文件 diff</text>
  <text x="92" y="539" class="sans green2 t10" font-weight="700">打开变更审阅 ›</text>
  <rect x="76" y="573" width="316" height="54" rx="11" class="card"/>
  <circle cx="98" cy="600" r="11" fill="#e7ece9"/>
  <text x="98" y="604" text-anchor="middle" class="sans ink t10" font-weight="800">3</text>
  <text x="119" y="597" class="sans ink t11" font-weight="750">建议变更尚未提交</text>
  <text x="119" y="615" class="sans muted t10">生成视图已显示预览差异</text>
