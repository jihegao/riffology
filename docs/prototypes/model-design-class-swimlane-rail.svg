      .card{fill:#fff;stroke:#d1d8d3;stroke-width:1}.softcard{fill:#f5f3ed;stroke:#d9ddd8;stroke-width:1}
      .green{fill:#173f37}.green2{fill:#2d7a66}.pale{fill:#e5f0eb}.amber{fill:#f6ecd6}.redpale{fill:#f7e7e4}
      .relation{stroke:#697a75;stroke-width:1.5;fill:none}
      .flow{stroke:#697a75;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#71817c;stroke-width:1.3;stroke-dasharray:6 5;fill:none}
      .add{fill:#dff0e7}.del{fill:#f6dfdc}.ctx{fill:#f5f4f0}
