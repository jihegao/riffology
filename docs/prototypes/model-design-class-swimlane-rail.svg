  <line x1="417" y1="166" x2="417" y2="1118" class="line"/>
  <rect x="76" y="184" width="316" height="54" rx="11" class="pale"/>
  <circle cx="97" cy="211" r="7" class="green2"/>
  <text x="113" y="208" class="sans ink t11" font-weight="750">Agent 空闲</text>
  <text x="113" y="226" class="sans muted t10">上下文已恢复 · build agent</text>
  <rect x="136" y="262" width="256" height="70" rx="13" fill="#dceae5"/>
